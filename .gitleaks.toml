# Extend the default rules. The only allowlisted paths are the two generic explorer test datasets (snapshot and live-API fixtures): they hold git commit ids (40 hex digits) keyed by the
# logical repo name "api", which the generic-api-key rule mistakes for a key. They are commit ids, not credentials.
[extend]
useDefault = true

[allowlist]
description = "explorer e2e datasets: commit ids keyed by repo name"
paths = ['''frontend/e2e/fixtures/(explorer|live)/.*''']
