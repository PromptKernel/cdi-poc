# Rules for scripts/prepush_gate.sh (KEY=value; parsed, never executed). PREPUSH_<KEY> environment variables override these.
# No names, paths or identities are listed here: private names live in the git-ignored TERMS_FILE, the allowed identity defaults to `git config user.email`.
IMAGE_EXTENSIONS="png jpg jpeg gif webp"
ALLOW_IMAGE_DIRS=""
FORBIDDEN_PATHS="docs/screenshots private/ docs/source out/"
TERMS_FILE="private/prepush-terms.txt"
OVERLAP_FILE="private/overlap-source.txt"
OVERLAP_WORDS=5
