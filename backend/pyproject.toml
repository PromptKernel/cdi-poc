[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdi"
version = "0.1.0"
description = "Cross-layer dependency graph and PR impact analysis"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0", "PyYAML==6.0.2"]

[project.scripts]
cdi = "cdi.cli:main"

[project.optional-dependencies]
neo4j = ["neo4j==5.28.1"]
api = ["fastapi==0.162.4", "uvicorn==0.54.0"]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.package-data]
cdi = ["config/profiles/*.yml"]

[tool.setuptools.packages.find]
where = ["src"]
